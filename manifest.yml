modules:
  # ---------------------------------------------------------------- Rovo agent
  rovo:agent:
    - key: decision-memory-agent
      name: Decision Memory
      description: >-
        Remembers what your team already decided, explains why, and warns when
        new work contradicts a past decision.
      icon: resource:icons;decision-memory.svg
      prompt: resource:agent-prompt;agent.md
      conversationStarters:
        - Does this issue conflict with any team decisions?
        - Why did we choose our current database?
        - Record a decision from this page
        - Which decisions are due for review?
      followUpPrompt: >-
        Suggest up to three short follow-up questions about related decisions,
        their owners, or whether a decision should be revisited.
      actions:
        - search-decisions
        - get-decision
        - check-conflicts
        - record-decision
        - supersede-decision
        - list-due-for-review

  # ------------------------------------------------ MCP server (same tools)
  rovo:mcp:
    - key: decision-memory-mcp
      name: Decision Memory MCP
      tools:
        - search-decisions
        - get-decision
        - check-conflicts
        - record-decision
        - list-due-for-review

  # --------------------------------------------- Actions (reusable tools)
  action:
    - key: search-decisions
      name: Search team decisions
      function: searchDecisions
      actionVerb: GET
      description: >-
        Search the team's recorded decisions (architecture, process, product,
        policy) by topic. Use for any "why do we", "did we decide", "what's our
        policy on" question. Returns decision key, statement, rationale, owner,
        status and source.
      inputs:
        query:
          title: Query
          type: string
          required: true
          description: Topic or question, e.g. "database choice" or "Friday deploys". May
            include a key like DEC-12.
        includeInactive:
          title: Include superseded and revoked
          type: boolean
          required: false
          description: Set true to also return decisions that are no longer active
            (history).
        limit:
          title: Max results
          type: integer
          required: false
          description: Maximum number of decisions to return (1-20, default 8).

    - key: get-decision
      name: Get decision details
      function: getDecision
      actionVerb: GET
      description: >-
        Get one decision by key (e.g. DEC-12) with rationale, status, what
        superseded it, and the owner's teams from Teamwork Graph.
      inputs:
        key:
          title: Decision key
          type: string
          required: true
          description: The decision key, e.g. DEC-12.

    - key: check-conflicts
      name: Check work against decisions
      function: checkConflicts
      actionVerb: GET
      description: >-
        Check planned work (a Jira issue key, or free text such as a proposal or
        PR description) against recorded decisions. With no input, checks the
        Jira issue the user is viewing. Returns conflicts with evidence.
      inputs:
        issueKey:
          title: Jira issue key
          type: string
          required: false
          description: Jira issue key such as PAY-142.
        text:
          title: Text to check
          type: string
          required: false
          description: Description of the planned work, if no issue key is given.
        diff:
          title: Code diff
          type: string
          required: false
          description: Optional unified diff (git diff). Lines added to dependency and infra files are checked.

    - key: record-decision
      name: Record a decision
      function: recordDecision
      actionVerb: CREATE
      description: >-
        Record a new team decision. Use only after the user confirms the exact
        wording. Write the statement as a clear rule, e.g. "Use PostgreSQL
        instead of MongoDB for new services." Returns the new key and warns if
        it contradicts an existing decision.
      inputs:
        statement:
          title: Decision statement
          type: string
          required: true
          description: The decision itself, phrased as a clear rule.
        title:
          title: Short title
          type: string
          required: false
          description: Optional short title (defaults to the first sentence).
        rationale:
          title: Rationale
          type: string
          required: false
          description: Why the decision was made, alternatives considered, constraints.
        tags:
          title: Tags
          type: string
          required: false
          description: Comma-separated tags, e.g. "database, backend".
        avoidTerms:
          title: Things to avoid
          type: string
          required: false
          description: Comma-separated technologies or practices this decision rules out.
        preferTerms:
          title: Things to prefer
          type: string
          required: false
          description: Comma-separated technologies or practices this decision prescribes.
        reviewBy:
          title: Review date
          type: string
          required: false
          description: Optional date (YYYY-MM-DD) when this decision should be revisited.
        sourceUrl:
          title: Source link
          type: string
          required: false
          description: Optional https link to where the decision was made (Confluence
            page, meeting notes).
        issueKey:
          title: Jira issue key
          type: string
          required: false
          description: Optional Jira issue the decision relates to.
        scope:
          title: Scope
          type: string
          required: false
          description: '"site" (default, visible to everyone) or "project" (only users of
            the related issue''s project).'

    - key: supersede-decision
      name: Supersede a decision
      function: supersedeDecision
      actionVerb: UPDATE
      description: >-
        Replace an existing active decision with a new one when the team has
        changed its mind. Only the owner or a Jira admin can do this. Confirm
        with the user first.
      inputs:
        key:
          title: Decision key
          type: string
          required: true
          description: Key of the decision being replaced, e.g. DEC-12.
        newStatement:
          title: New decision statement
          type: string
          required: true
          description: The new decision, phrased as a clear rule.
        rationale:
          title: Rationale
          type: string
          required: false
          description: What changed and why.

    - key: list-due-for-review
      name: List decisions due for review
      function: listDueForReview
      actionVerb: GET
      description: List active decisions whose review date has passed and should be
        revisited.
      inputs:
        scope:
          title: Scope
          type: string
          required: false
          description: Unused; reserved for future filtering.

  # ------------------------------------------------------------- Jira UI
  jira:issuePanel:
    - key: decision-memory-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: Decision Memory
      icon: resource:icons;decision-memory.svg

  jira:globalPage:
    - key: decision-memory-log
      resource: decision-log
      resolver:
        function: resolver
      render: native
      title: Decision Log
      icon: resource:icons;decision-memory.svg

  jira:adminPage:
    - key: decision-memory-settings
      resource: admin-page
      resolver:
        function: resolver
      render: native
      title: Decision Memory
      icon: resource:icons;decision-memory.svg

  # ------------------------------------------------------- Confluence UI
  confluence:contentAction:
    - key: decision-memory-capture-page
      resource: confluence-page-action
      resolver:
        function: resolver
      render: native
      title: Capture decisions (Decision Memory)

  macro:
    - key: decision-memory-macro
      resource: confluence-macro
      resolver:
        function: resolver
      render: native
      title: Decision Log
      description: Show your team's recorded decisions on this page.
      layout: block

  # --------------------------------------- Teamwork Graph (publish decisions)
  graph:connector:
    - key: decision-memory-graph
      name: Decision Memory
      icons:
        light: resource:icons;decision-memory.svg
        dark: resource:icons;decision-memory.svg
      objectTypes:
        - atlassian:document
      capabilities:
        replicatesPermissions: false
        syncFidelity: upsert
        supportsIncrementalSync: true
      datasource:
        formConfiguration:
          instructions:
            - Publishes every site-wide decision recorded in Decision Memory as a document linked to its Jira issue.
            - Project-scoped decisions stay private to Decision Memory.
          form:
            - key: general
              type: header
              title: Decision Memory
              description: No credentials are needed. Decisions come from this site.
              properties:
                - key: label
                  label: Connection name
                  placeholder: Team decisions
                  type: string
                  isRequired: false
          validateConnection:
            function: validateGraphConnection
        onConnectionChange:
          function: onGraphConnectionChange

  # ---------------------------------------------------------- Triggers
  scheduledTrigger:
    - key: decision-memory-daily-review
      function: onDailyReview
      interval: day

  trigger:
    - key: decision-memory-issue-events
      function: onIssueEvent
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
    - key: decision-memory-comment-events
      function: onCommentEvent
      events:
        - avi:jira:commented:issue
      filter:
        ignoreSelf: true
    - key: decision-memory-lifecycle
      function: onLifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app

  # ------------------------------------------------------------ Storage
  sql:
    - key: main
      engine: mysql

  # ---------------------------------------------------------- Functions
  function:
    - key: resolver
      handler: index.handler
    - key: searchDecisions
      handler: index.searchDecisions
    - key: getDecision
      handler: index.getDecision
    - key: checkConflicts
      handler: index.checkConflicts
    - key: recordDecision
      handler: index.recordDecision
    - key: supersedeDecision
      handler: index.supersedeDecision
    - key: listDueForReview
      handler: index.listDueForReview
    - key: onIssueEvent
      handler: index.onIssueEvent
    - key: onCommentEvent
      handler: index.onCommentEvent
    - key: onLifecycle
      handler: index.onLifecycle
    - key: onDailyReview
      handler: index.onDailyReview
    - key: validateGraphConnection
      handler: index.validateGraphConnection
    - key: onGraphConnectionChange
      handler: index.onGraphConnectionChange

resources:
  - key: issue-panel
    path: src/frontend/issuePanel.jsx
  - key: decision-log
    path: src/frontend/decisionLog.jsx
  - key: admin-page
    path: src/frontend/adminPage.jsx
  - key: confluence-page-action
    path: src/frontend/confluencePageAction.jsx
  - key: confluence-macro
    path: src/frontend/confluenceMacro.jsx
  - key: icons
    path: static/icons
  - key: agent-prompt
    path: prompts

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:graph:user:atlassian
    - read:graph:team:atlassian
    - write:object:jira
    - read:object:jira
    - delete:object:jira
    - read:page:confluence

app:
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  runtime:
    name: nodejs22.x
    memoryMB: 256
  id: ari:cloud:ecosystem::app/5f7d5a1f-7d63-4e37-80ee-a2e55c108c9f
